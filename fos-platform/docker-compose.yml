version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fos-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/fos.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - PREFERRED_PROVIDER=${PREFERRED_PROVIDER:-anthropic}
      - FAST_MODEL=${FAST_MODEL:-claude-haiku-4-5-20251001}
      - SMART_MODEL=${SMART_MODEL:-claude-sonnet-4-6}
      - DEEP_MODEL=${DEEP_MODEL:-claude-opus-4-8}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-long-random-string}
      - UPLOAD_DIR=/app/uploads
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - fos-data:/app/data
      - fos-uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    container_name: fos-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: fos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

  redis:
    image: redis:7-alpine
    container_name: fos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - fos-redis:/data
    ports:
      - "6379:6379"

volumes:
  fos-data:
  fos-uploads:
  fos-redis:
