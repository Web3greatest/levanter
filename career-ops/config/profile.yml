# Candidate Profile — UPDATE THIS WITH YOUR ACTUAL DETAILS

personal:
  name: "[YOUR FULL NAME]"
  email: "[YOUR EMAIL]"
  phone: "[YOUR PHONE e.g. +234-XXX-XXXX-XXX]"
  location: "Lagos, Nigeria"
  linkedin: "[YOUR LINKEDIN URL]"
  portfolio: "[YOUR PORTFOLIO/WEBSITE URL if any]"
  instagram: "[YOUR INSTAGRAM if relevant for fashion/events]"

# Work preferences
preferences:
  employment_types:
    - full-time
    - freelance
    - contract
  work_modes:
    - remote (international)
    - hybrid (Lagos)
    - onsite (Lagos)

  # Salary minimums — DO NOT apply below these
  salary:
    naira_minimum: 200000          # ₦200,000/month for Nigerian roles
    usd_minimum: 800               # $800/month for international remote
    naira_target: 350000           # Ideal Nigerian salary
    usd_target: 2000               # Ideal international salary
    freelance_min_per_project: 50000  # ₦50k minimum per project

  notice_period: "Immediate / 2 weeks"

  # Priority: which type of opportunity to chase harder right now
  priority: "both"  # options: freelance | fulltime | both

# Target industries (ranked by preference)
industries:
  - Events & Entertainment
  - Fashion & Style
  - Lifestyle & Wellness
  - Creative Agencies & Marketing
  - Business & Consulting
  - Media & Content Creation

# Target roles (fill in based on your actual experience)
