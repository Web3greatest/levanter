  fulltime:
    - "[e.g. Events Coordinator]"
    - "[e.g. Brand Manager]"
    - "[e.g. Fashion PR Manager]"
    - "[e.g. Content Strategist]"
    - "[e.g. Marketing Manager]"
  freelance:
    - "[e.g. Event Planner]"
    - "[e.g. Stylist]"
    - "[e.g. Social Media Consultant]"
    - "[e.g. Content Creator]"
    - "[e.g. Brand Consultant]"

# Your core skills (fill these in!)
skills:
  primary: []     # e.g. [Event Planning, Brand Management, Social Media Marketing]
